name: DOJO v0.35.7 Windows editor-loss focused control
on:
  push:
    branches:
      - codex/dojo-v0357-windows-editor-loss-focused
permissions:
  contents: read
concurrency:
  group: dojo-v0357-windows-editor-loss-control
  cancel-in-progress: false
env:
  DOJO_SOURCE_REF: verify/v0357-windows-editor-loss-passive
  DOJO_SOURCE_SHA: d96bc4bb8a7235a25f3ba2d85c8dd764e96f5752
  DOJO_SOURCE_TREE: 75ee0df96fde695f6150c71c4856fd549a9a4bfd
  DOJO_BASE_SHA: 045d1109e03a03e9e8ef77a8e40c42b318ed6a59
  DOJO_BASE_TREE: 7348230a0b6d0040fed43941bdf5faca7f6aa6da
  DOJO_VERSION: 0.35.7
  WEBVIEW2_VERSION: 1.0.3485.44
jobs:
  focused-control:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout exact repaired source
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "${DOJO_SOURCE_DEPLOY_KEY}"
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-ssh"; mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"; chmod 600 "${key_dir}/id_ed25519"
          git init -q dojo
          git -C dojo remote add origin git@github.com:daikainozaki-cyber/dojo-ci.git
          GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git -C dojo fetch --no-tags origin "refs/heads/${DOJO_SOURCE_REF}"
          git -C dojo checkout -q FETCH_HEAD
          rm -f "${key_dir}/id_ed25519"
          git -C dojo submodule update --init --recursive --depth 1

      - name: Verify repaired source identity and scope
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference = 'Stop'
          $head=(git rev-parse HEAD).Trim(); $tree=(git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne $env:DOJO_SOURCE_SHA -or $tree -ne $env:DOJO_SOURCE_TREE) { throw "source provenance drift: $head $tree" }
          $parent=(git rev-parse 'HEAD^1').Trim(); $parentTree=(git rev-parse 'HEAD^1^{tree}').Trim()
          if ($parent -ne $env:DOJO_BASE_SHA -or $parentTree -ne $env:DOJO_BASE_TREE) { throw "repair parent drift: $parent $parentTree" }
          $changed=@(git diff --name-only "$env:DOJO_BASE_SHA..$head")
          if ($changed.Count -ne 1 -or $changed[0] -ne 'tests/test_plugin_host_sandbox_worker_transport.cpp') { throw "repair scope drift: $($changed -join ',')" }
          $version=(Select-String CMakeLists.txt -Pattern 'project\(DOJO VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          if ($version -ne $env:DOJO_VERSION -or (git status --porcelain).Length -ne 0) { throw 'version or clean-checkout drift' }
          $mk1=(Get-Content third_party\pad-sensei-keys-mk1\UPSTREAM_SHA).Trim()
          if ($mk1 -ne '2325c445d5f35be7fefa0aa0601fd0e894896820') { throw "MK1 drift: $mk1" }
          foreach($f in @('Source/EPianoEngine.cpp','Source/EPianoWorkletProcessor.cpp','Source/AudioReverb.cpp','Source/Mk1ParameterModel.cpp','Source/Mk1Instrument.cpp','cmake/PadSenseiKeysMK1Core.cmake')) { if (!(Test-Path "third_party\pad-sensei-keys-mk1\$f")) { throw "missing vendored MK1 $f" } }
          "MK1_SHA=$mk1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MK1_SOURCE_DIR=$((Resolve-Path third_party\pad-sensei-keys-mk1).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $provenance=Join-Path $env:RUNNER_TEMP 'dojo-v0357-editor-loss-focused-provenance.json'
          @{source_ref=$env:DOJO_SOURCE_REF; source_sha=$head; source_tree=$tree; base_sha=$parent; base_tree=$parentTree; dojo_version=$env:DOJO_VERSION; runner_os=$env:RUNNER_OS; workflow_run_id=$env:GITHUB_RUN_ID} | ConvertTo-Json -Depth 3 | Set-Content $provenance -Encoding utf8

      - name: Guard repaired mirror ref before build
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-ref-guard"; mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"; chmod 600 "${key_dir}/id_ed25519"
          actual="$(GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote git@github.com:daikainozaki-cyber/dojo-ci.git "refs/heads/${DOJO_SOURCE_REF}" | awk '{print $1}')"
          test "${actual}" = "${DOJO_SOURCE_SHA}"

      - name: Install WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget" -ExcludeVersion
          if($LASTEXITCODE){throw "WebView2 install failed ($LASTEXITCODE)"}
          "WEBVIEW2_DIR=$env:RUNNER_TEMP\nuget" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build focused target
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-windows-v0357 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:WEBVIEW2_DIR" -DPAD_SENSEI_MK1_SOURCE_DIR="$env:MK1_SOURCE_DIR" -DDOJO_REQUIRE_MK1=ON
          if($LASTEXITCODE){throw "configure failed ($LASTEXITCODE)"}
          cmake --build build-windows-v0357 --config Release --parallel --target DojoPluginHostTests
          if($LASTEXITCODE){throw "focused build failed ($LASTEXITCODE)"}

      - name: Run focused DojoPluginHostTests three times
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          $registered=& ctest --test-dir build-windows-v0357 -C Release -N
          if($LASTEXITCODE){throw "ctest enumeration failed ($LASTEXITCODE)"}
          if(-not ($registered -match '^\s*Test\s+#\s*[0-9]+:\s*DojoPluginHostTests\s*$')){throw 'focused CTest is not registered: DojoPluginHostTests'}
          for($i=1; $i -le 3; $i++) {
            $junit="windows-DojoPluginHostTests-$i.xml"
            ctest --test-dir build-windows-v0357 -C Release --output-on-failure --no-tests=error -R '^DojoPluginHostTests$' --output-junit $junit
            $exit=$LASTEXITCODE
            $buildJunit="build-windows-v0357/$junit"
            if(Test-Path $buildJunit){Copy-Item $buildJunit $junit -Force}
            $lastTest='build-windows-v0357/Testing/Temporary/LastTest.log'
            if(Test-Path $lastTest){Copy-Item $lastTest "windows-DojoPluginHostTests-$i-LastTest.log" -Force}
            if($exit){throw "focused DojoPluginHostTests run $i failed ($exit)"}
          }

      - name: Verify focused source identity after tests
        if: always()
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim(); $tree=(git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne $env:DOJO_SOURCE_SHA -or $tree -ne $env:DOJO_SOURCE_TREE -or (git status --porcelain).Length -ne 0) { throw 'post-test source drift' }
          $parent=(git rev-parse 'HEAD^1').Trim(); $parentTree=(git rev-parse 'HEAD^1^{tree}').Trim()
          if ($parent -ne $env:DOJO_BASE_SHA -or $parentTree -ne $env:DOJO_BASE_TREE) { throw 'post-test repair parent drift' }
          $changed=@(git diff --name-only "$env:DOJO_BASE_SHA..$head")
          if ($changed.Count -ne 1 -or $changed[0] -ne 'tests/test_plugin_host_sandbox_worker_transport.cpp') { throw "post-test repair scope drift: $($changed -join ',')" }

      - name: Guard repaired mirror ref after tests
        if: always()
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-ref-guard-after"; mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"; chmod 600 "${key_dir}/id_ed25519"
          actual="$(GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote git@github.com:daikainozaki-cyber/dojo-ci.git "refs/heads/${DOJO_SOURCE_REF}" | awk '{print $1}')"
          test "${actual}" = "${DOJO_SOURCE_SHA}"

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOJO-v0.35.7-Windows-editor-loss-focused-diagnostics
          path: |
            ${{ runner.temp }}/dojo-v0357-editor-loss-focused-provenance.json
            dojo/windows-DojoPluginHostTests-*.xml
            dojo/build-windows-v0357/windows-DojoPluginHostTests-*.xml
            dojo/windows-DojoPluginHostTests-*-LastTest.log
          if-no-files-found: ignore
          retention-days: 14
