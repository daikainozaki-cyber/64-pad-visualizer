# DRAFT - not yet pushed. Revision of dojo-v035-windows-executor.yml.
#
# Why this differs from the verbatim PR #128 template:
#   pad-sensei/dojo has deploy keys DISABLED at the org level (verified 2026-08-16,
#   HTTP 422 "Deploy keys are disabled for this repository"), and DESKTOP_DISPATCH_TOKEN
#   cannot read it (HTTP 403). Source is therefore taken from the SHA-preserving personal
#   mirror daikainozaki-cyber/dojo-ci. Git is content-addressed, so commit
#   42abd8c... in the mirror is byte-identical to the same commit in pad-sensei/dojo,
#   and the exact-SHA verification below still proves it.
#
# Product SSOT remains pad-sensei/dojo. Every verification step (exact SHA, version,
# clean tree, MK1 SHA, AMD64 PE machine, manifest validation, ctest) is unchanged.

name: Build DOJO v0.35 Windows x64 from personal Actions

on:
  push:
    branches:
      - infra/dojo-v035-windows-executor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dojo-v035-windows-personal-executor
  cancel-in-progress: false

env:
  # cad95da = 42abd8c (the original v0.35.0 candidate) + the MSVC /Zc:lambda fix.
  # 42abd8c cannot compile on Windows: MSVC's legacy lambda parser raises C3493 in
  # tests/test_backing_engine.cpp. Verified by the failed build on 2026-08-16.
  DOJO_SOURCE_SHA: cad95dad379a42ef3a8a6f018e887416369399a0
  MK1_PINNED_SHA: b335be092aa2f4b2b8ae90cd02052c59ee5f63ae

jobs:
  build:
    # Keep this executor in a public personal repository so the standard
    # GitHub-hosted runner does not consume the private organization budget.
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout exact private DOJO candidate
        # Private parent over SSH (repo-scoped read-only deploy key). Public submodules
        # are fetched separately over https so the repo-scoped key is never used for a
        # repository it does not cover.
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DOJO_SOURCE_DEPLOY_KEY}" ]; then
            echo "::error::secret DOJO_SOURCE_DEPLOY_KEY is not set"
            exit 1
          fi
          temp_posix="$(cygpath -u "${RUNNER_TEMP}")"
          key_dir="${temp_posix}/dojo-ssh"
          mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"
          chmod 600 "${key_dir}/id_ed25519"

          git init -q dojo
          git -C dojo remote add origin git@github.com:daikainozaki-cyber/dojo-ci.git
          GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git -C dojo fetch --no-tags origin "${DOJO_SOURCE_SHA}"
          git -C dojo checkout -q FETCH_HEAD
          rm -f "${key_dir}/id_ed25519"

          # Submodules are all public (JUCE / pad-core / pad-progression / signalsmith x2).
          # No credential is used here; https anonymous access is sufficient.
          git -C dojo submodule update --init --recursive --depth 1

      - name: Verify exact DOJO source
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:DOJO_SOURCE_SHA) { throw "DOJO SHA mismatch: $actual" }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(DOJO VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          if ($version -ne '0.35.0') { throw "Expected DOJO 0.35.0, got $version" }
          if ((git status --porcelain).Length -ne 0) { throw 'DOJO checkout is dirty' }
          Write-Host "DOJO_SOURCE_SHA=$actual"

      - name: Checkout exact private MK1 DSP
        shell: bash
        env:
          MK1_SOURCE_DEPLOY_KEY: ${{ secrets.MK1_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MK1_SOURCE_DEPLOY_KEY}" ]; then
            echo "::error::secret MK1_SOURCE_DEPLOY_KEY is not set"
            exit 1
          fi
          temp_posix="$(cygpath -u "${RUNNER_TEMP}")"
          key_dir="${temp_posix}/mk1-ssh"
          mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${MK1_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"
          chmod 600 "${key_dir}/id_ed25519"

          git init -q mk1-plugin
          git -C mk1-plugin remote add origin git@github.com:daikainozaki-cyber/pad-sensei-mk1-plugin.git
          git -C mk1-plugin config core.sparseCheckout true
          git -C mk1-plugin sparse-checkout init --cone
          git -C mk1-plugin sparse-checkout set Source
          GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git -C mk1-plugin fetch --depth=1 --no-tags origin "${MK1_PINNED_SHA}"
          git -C mk1-plugin checkout -q FETCH_HEAD
          rm -f "${key_dir}/id_ed25519"

      - name: Verify MK1 source identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git -C mk1-plugin rev-parse HEAD).Trim()
          if ($actual -ne $env:MK1_PINNED_SHA) { throw "MK1 SHA mismatch: $actual" }
          foreach ($file in @('Source/EPianoEngine.cpp','Source/EPianoWorkletProcessor.cpp')) {
            if (-not (Test-Path (Join-Path 'mk1-plugin' $file))) { throw "Missing MK1 source: $file" }
          }
          Write-Host "MK1_SHA=$actual"

      - name: Install WebView2 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          nuget install Microsoft.Web.WebView2 `
            -Version 1.0.3485.44 `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -ExcludeVersion
          # nuget.exe is a native command: a non-zero exit does not throw. Without this
          # check a failed WebView2 fetch would be masked by the succeeding Out-File and
          # the failure would resurface later as a confusing configure error.
          if ($LASTEXITCODE -ne 0) { throw "nuget install WebView2 failed ($LASTEXITCODE)" }
          "WEBVIEW2_DIR=$env:RUNNER_TEMP\nuget" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure x64 Release
        shell: pwsh
        working-directory: dojo
        run: |
          # $ErrorActionPreference only governs PowerShell cmdlets. A native
          # executable (cmake.exe) returning non-zero does NOT throw, so every
          # native call below is followed by an explicit $LASTEXITCODE check.
          # Without them a failing command can be masked by a later succeeding
          # one and the step reports success. (Antigravity audit 2026-08-16)
          $ErrorActionPreference = 'Stop'
          $mk1 = (Resolve-Path '..\mk1-plugin').Path
          cmake -S . -B build-windows-v035 -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:WEBVIEW2_DIR" `
            -DPAD_SENSEI_MK1_SOURCE_DIR="$mk1" `
            -DDOJO_REQUIRE_MK1=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($LASTEXITCODE)" }

      - name: Build app and every native test target
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-windows-v035 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "app build failed ($LASTEXITCODE)" }
          cmake --build build-windows-v035 --config Release --target dojo-tests --parallel
          if ($LASTEXITCODE -ne 0) { throw "dojo-tests build failed ($LASTEXITCODE)" }

      # Diagnostic only - never fails the job, never gates anything.
      # The 2026-08-16 ctest run failed 4/111 and both causes were unproven:
      #   - DojoMk1Tests / DojoPluginRoutingTests / DojoTrackSoundRoutingTests SEGFAULT
      #     (two of them in 0.02s, the "died in main's prologue" signature that build.md
      #     attributes to stack exhaustion). But /STACK:8388608 IS reachable by those
      #     targets (CMakeLists line 380 vs targets at 384/507/579), and macOS also has
      #     an 8MB main thread and passes. So the stack story does not yet add up.
      #   - DojoHps4RecordingFormContractTests fails at root.isDirectory() on a path
      #     CMake passes as argv[1]: packaging/alpha-release/materials/HPS第4回.
      #     The 80 files are present in the checkout, so this is not a missing-materials
      #     problem. On Windows argv is delivered in the active code page, not UTF-8,
      #     while the test does juce::String::fromUTF8(argv[1]) - which works on macOS.
      # Measure both instead of guessing. build.md: 推測でコードを直して回し直さない.
      - name: Diagnose stack reserve and Japanese argv path
        continue-on-error: true
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference = 'Continue'

          function Get-StackReserve([string]$path) {
            # PE32+ optional header: SizeOfStackReserve is 8 bytes at
            # optionalHeaderStart + 72, where optionalHeaderStart = peOffset + 24
            # (4 byte signature + 20 byte COFF header).
            $b = [System.IO.File]::ReadAllBytes($path)
            $pe = [BitConverter]::ToInt32($b, 0x3c)
            $magic = [BitConverter]::ToUInt16($b, $pe + 24)
            if ($magic -ne 0x20B) { return "not PE32+ (magic 0x{0:X})" -f $magic }
            $reserve = [BitConverter]::ToUInt64($b, $pe + 24 + 72)
            return "{0} bytes ({1:N2} MB)" -f $reserve, ($reserve / 1MB)
          }

          Write-Host "===== stack reserve baked into each binary ====="
          $targets = @(
            'build-windows-v035\DOJO_artefacts\Release\DOJO.exe',
            'build-windows-v035\Release\DojoMk1Tests.exe',
            'build-windows-v035\Release\DojoPluginRoutingTests.exe',
            'build-windows-v035\Release\DojoTrackSoundRoutingTests.exe',
            'build-windows-v035\Release\DojoSceneLoaderTests.exe'
          )
          foreach ($t in $targets) {
            if (Test-Path $t) {
              Write-Host ("{0,-58} {1}" -f (Split-Path $t -Leaf), (Get-StackReserve $t))
            } else {
              Write-Host ("{0,-58} MISSING" -f (Split-Path $t -Leaf))
            }
          }
          Write-Host "(expected 8388608 = 8.00 MB if CMakeLists /STACK:8388608 reached the link)"

          # The 8.00 MB above refutes stack exhaustion for the failing tests, so the
          # SEGFAULTs need a different explanation. Windows encodes the reason in the
          # process exit code, so ask for it instead of inferring from the 0.02s timing.
          #   0xC00000FD STATUS_STACK_OVERFLOW   -> stack after all
          #   0xC0000005 STATUS_ACCESS_VIOLATION -> null / invalid dereference
          #   0xC0000409 STATUS_STACK_BUFFER_OVERRUN (/GS)
          #   0xC000001D / 0xC000008C etc         -> illegal instruction / array bounds
          Write-Host ""
          Write-Host "===== why the three tests actually die ====="
          function Show-Crash([string]$exe) {
            $name = Split-Path $exe -Leaf
            if (-not (Test-Path $exe)) { Write-Host ("{0,-34} MISSING" -f $name); return }
            $p = Start-Process -FilePath $exe -PassThru -Wait -NoNewWindow `
                   -RedirectStandardOutput "$env:RUNNER_TEMP\$name.out" `
                   -RedirectStandardError  "$env:RUNNER_TEMP\$name.err"
            $code = [uint32]([int64]$p.ExitCode -band 0xFFFFFFFF)
            $label = switch ($code) {
              0xC00000FD { 'STATUS_STACK_OVERFLOW' }
              0xC0000005 { 'STATUS_ACCESS_VIOLATION' }
              0xC0000409 { 'STATUS_STACK_BUFFER_OVERRUN' }
              0xC000001D { 'STATUS_ILLEGAL_INSTRUCTION' }
              0          { 'clean exit' }
              default    { 'other' }
            }
            Write-Host ("{0,-34} exit 0x{1:X8}  {2}" -f $name, $code, $label)
            # Whether anything reached stdout separates "died in main's prologue"
            # from "ran, then crashed" (build.md's 切り分け表).
            $out = Get-Content "$env:RUNNER_TEMP\$name.out" -ErrorAction SilentlyContinue
            $err = Get-Content "$env:RUNNER_TEMP\$name.err" -ErrorAction SilentlyContinue
            Write-Host ("  stdout lines: {0}, stderr lines: {1}" -f @($out).Count, @($err).Count)
            if (@($out).Count) { @($out) | Select-Object -First 3 | ForEach-Object { Write-Host "    out> $_" } }
            if (@($err).Count) { @($err) | Select-Object -First 5 | ForEach-Object { Write-Host "    err> $_" } }
          }
          Show-Crash 'build-windows-v035\Release\DojoMk1Tests.exe'
          Show-Crash 'build-windows-v035\Release\DojoPluginRoutingTests.exe'
          Show-Crash 'build-windows-v035\Release\DojoTrackSoundRoutingTests.exe'

          Write-Host ""
          Write-Host "===== Japanese argv path ====="
          # chcp reports the CONSOLE code page. The CRT builds argv from the process
          # ANSI code page (GetACP), which chcp does not change. If GetACP is not 65001
          # then 第4回 cannot survive the wide->ANSI conversion into argv[1], and
          # juce::String::fromUTF8(argv[1]) rebuilds a path that does not exist.
          Add-Type -Name Cp -Namespace Win -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint GetACP();' -ErrorAction SilentlyContinue
          try { Write-Host ("GetACP() (used for argv)  : {0}" -f [Win.Cp]::GetACP()) } catch { Write-Host "GetACP() : unavailable" }
          Write-Host "chcp (console only)       :"
          chcp

          $dir = 'packaging\alpha-release\materials\HPS第4回'
          $exe = 'build-windows-v035\Release\DojoHps4RecordingFormContractTests.exe'
          Write-Host "Test-Path from PowerShell : $(Test-Path -LiteralPath $dir)"
          Write-Host "child directories seen    : $((Get-ChildItem -LiteralPath $dir -Directory -ErrorAction SilentlyContinue).Count)"

          if (Test-Path $exe) {
            $full = (Resolve-Path -LiteralPath $dir).Path
            Write-Host ""
            Write-Host "--- A. same path, non-ASCII name (expected to fail today) ---"
            & $exe $full 2>&1 | ForEach-Object { Write-Host "  test> $_" }
            Write-Host "exit code : $LASTEXITCODE"

            # Decisive control: identical bytes on disk, ASCII-only directory name.
            # If A fails and B passes, the non-ASCII argv is proven to be the cause
            # without touching product code or reading argv byte by byte.
            Write-Host ""
            Write-Host "--- B. identical content, ASCII name (control) ---"
            $ascii = Join-Path $env:RUNNER_TEMP 'hps4_ascii'
            if (Test-Path $ascii) { Remove-Item -Recurse -Force $ascii }
            Copy-Item -LiteralPath $full -Destination $ascii -Recurse
            Write-Host "invoking with : $ascii"
            & $exe $ascii 2>&1 | ForEach-Object { Write-Host "  test> $_" }
            Write-Host "exit code : $LASTEXITCODE"
          }

      - name: Run Windows native tests
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference = 'Stop'
          ctest --test-dir build-windows-v035 -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "ctest failed ($LASTEXITCODE)" }

      - name: Verify AMD64 PE and emit exact build manifest
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build-windows-v035\DOJO_artefacts\Release\DOJO.exe'
          if (-not (Test-Path $exe)) { throw "DOJO.exe not found: $exe" }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 256) { throw 'DOJO.exe is too small to be a valid PE image' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or ($peOffset + 6) -ge $bytes.Length) { throw 'Invalid PE header offset' }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) { throw 'PE signature missing' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ('Expected AMD64 PE machine 0x8664, got 0x{0:X4}' -f $machine) }

          $sha = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLower()
          $embedded = @()
          Get-Content 'packaging\alpha-release\material-collections.txt' | ForEach-Object {
            $line = $_.Trim()
            if ($line -and -not $line.StartsWith('#')) {
              $parts = $line.Split('|')
              if ($parts.Count -ne 2) { throw "Invalid material policy line: $line" }
              if ($parts[1].Trim() -eq 'repo') { $embedded += $parts[0].Trim() }
            }
          }
          if ($embedded.Count -eq 0) { throw 'No repo-mode embedded collection in release policy' }

          New-Item -ItemType Directory -Force dist-windows-build | Out-Null
          Copy-Item $exe 'dist-windows-build\DOJO.exe'
          $manifest = [ordered]@{
            schema               = 'dojo-windows-build-v1'
            git_head_sha         = $env:DOJO_SOURCE_SHA
            dojo_version         = '0.35.0'
            architecture         = 'x86_64'
            exe_sha256           = $sha
            mk1_sha              = $env:MK1_PINNED_SHA
            with_mk1             = $true
            embedded_collections = $embedded
          }
          ($manifest | ConvertTo-Json -Depth 4) | Set-Content -Path 'dist-windows-build\build-manifest.json' -Encoding utf8
          python packaging/alpha-release/validate-windows-build-manifest.py `
            dist-windows-build/build-manifest.json `
            dist-windows-build/DOJO.exe
          # Native command: $ErrorActionPreference does not catch a non-zero exit,
          # so without this check a failing release-gate validation would pass.
          if ($LASTEXITCODE -ne 0) { throw "manifest validation failed ($LASTEXITCODE)" }
          Write-Host "WINDOWS_EXE_SHA256=$sha"
          Write-Host 'WINDOWS_PE_MACHINE=0x8664'
          Get-Content 'dist-windows-build\build-manifest.json'

      - name: Upload exact Windows build output
        uses: actions/upload-artifact@v4
        with:
          name: DOJO-v0.35.0-Windows-x64-build
          path: |
            dojo/dist-windows-build/DOJO.exe
            dojo/dist-windows-build/build-manifest.json
          if-no-files-found: error
          retention-days: 14
