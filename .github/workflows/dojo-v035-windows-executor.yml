name: Build DOJO v0.35.7 Windows x64 candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dojo-v0357-windows-personal-executor
  cancel-in-progress: false
env:
  DOJO_SOURCE_REF: candidate/v0357-windows-final
  DOJO_SOURCE_SHA: 045d1109e03a03e9e8ef77a8e40c42b318ed6a59
  DOJO_SOURCE_TREE: 7348230a0b6d0040fed43941bdf5faca7f6aa6da
  DOJO_VERSION: 0.35.7
  WEBVIEW2_VERSION: 1.0.3485.44
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout exact mirrored candidate
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "${DOJO_SOURCE_DEPLOY_KEY}"
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-ssh"; mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"; chmod 600 "${key_dir}/id_ed25519"
          git init -q dojo
          git -C dojo remote add origin git@github.com:daikainozaki-cyber/dojo-ci.git
          GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git -C dojo fetch --no-tags origin "refs/heads/${DOJO_SOURCE_REF}"
          git -C dojo checkout -q FETCH_HEAD
          rm -f "${key_dir}/id_ed25519"
          git -C dojo submodule update --init --recursive --depth 1
      - name: Verify exact source and vendored MK1
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference = 'Stop'
          $head=(git rev-parse HEAD).Trim(); $tree=(git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne $env:DOJO_SOURCE_SHA -or $tree -ne $env:DOJO_SOURCE_TREE) { throw "source provenance drift: $head $tree" }
          $version=(Select-String CMakeLists.txt -Pattern 'project\(DOJO VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          if ($version -ne $env:DOJO_VERSION -or (git status --porcelain).Length -ne 0) { throw 'version or clean-checkout drift' }
          $mk1=(Get-Content third_party\pad-sensei-keys-mk1\UPSTREAM_SHA).Trim()
          if ($mk1 -ne '2325c445d5f35be7fefa0aa0601fd0e894896820') { throw "MK1 drift: $mk1" }
          foreach($f in @('Source/EPianoEngine.cpp','Source/EPianoWorkletProcessor.cpp','Source/AudioReverb.cpp','Source/Mk1ParameterModel.cpp','Source/Mk1Instrument.cpp','cmake/PadSenseiKeysMK1Core.cmake')) { if (!(Test-Path "third_party\pad-sensei-keys-mk1\$f")) { throw "missing vendored MK1 $f" } }
          "MK1_SHA=$mk1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MK1_SOURCE_DIR=$((Resolve-Path third_party\pad-sensei-keys-mk1).Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Guard mirror ref before build
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-ref-guard"; mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"; chmod 600 "${key_dir}/id_ed25519"
          actual="$(GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote git@github.com:daikainozaki-cyber/dojo-ci.git "refs/heads/${DOJO_SOURCE_REF}" | awk '{print $1}')"
          test "${actual}" = "${DOJO_SOURCE_SHA}"
      - name: Install WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget" -ExcludeVersion
          if($LASTEXITCODE){throw "WebView2 install failed ($LASTEXITCODE)"}
          "WEBVIEW2_DIR=$env:RUNNER_TEMP\nuget" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure and build x64
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-windows-v0357 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:WEBVIEW2_DIR" -DPAD_SENSEI_MK1_SOURCE_DIR="$env:MK1_SOURCE_DIR" -DDOJO_REQUIRE_MK1=ON
          if($LASTEXITCODE){throw "configure failed ($LASTEXITCODE)"}
          cmake --build build-windows-v0357 --config Release --parallel --target DOJO dojo-tests DojoPushDisplayRendererTests DojoPushFeedbackPresentTests DojoPushDisplayTransportTests DojoPushDisplayUsbWindowsTests DojoPushMappingTests DojoPushReconnectTests DojoPluginSandboxProbeTests DojoPluginHostTests DojoAppStateTests DojoPluginRoutingTests DojoTrackSoundRoutingTests DojoPluginFileScanQueueTests DojoAssertionsEnabledTests DojoMk1Tests
          if($LASTEXITCODE){throw "build failed ($LASTEXITCODE)"}
      - name: Run required Windows native matrix
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          $required=@('DojoPushDisplayRendererTests','DojoPushFeedbackPresentTests','DojoPushDisplayTransportTests','DojoPushDisplayUsbWindowsTests','DojoPushMappingTests','DojoPushReconnectTests','DojoPluginSandboxProbeTests','DojoPluginHostTests','DojoAppStateTests','DojoPluginRoutingTests','DojoTrackSoundRoutingTests','DojoPluginFileScanQueueTests','DojoAssertionsEnabledTests','DojoMk1Tests')
          $registered=& ctest --test-dir build-windows-v0357 -C Release -N
          if($LASTEXITCODE){throw "ctest enumeration failed ($LASTEXITCODE)"}
          foreach($name in $required){if(-not ($registered -match ('^\s*Test\s+#\s*[0-9]+:\s*'+[regex]::Escape($name)+'\s*$'))){throw "required CTest is not registered: $name"}}
          ctest --test-dir build-windows-v0357 -C Release --output-on-failure --no-tests=error -R "^(DojoPushDisplayRendererTests|DojoPushFeedbackPresentTests|DojoPushDisplayTransportTests|DojoPushDisplayUsbWindowsTests|DojoPushMappingTests|DojoPushReconnectTests|DojoPluginSandboxProbeTests|DojoPluginHostTests|DojoAppStateTests|DojoPluginRoutingTests|DojoTrackSoundRoutingTests|DojoPluginFileScanQueueTests|DojoAssertionsEnabledTests|DojoMk1Tests)$" --output-junit windows-required-ctest.xml
          if($LASTEXITCODE){throw "required ctest matrix failed ($LASTEXITCODE)"}
      - name: Run full Windows CTest with JUnit
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          ctest --test-dir build-windows-v0357 -C Release --output-on-failure --no-tests=error --output-junit windows-ctest.xml
          if($LASTEXITCODE){throw "ctest failed ($LASTEXITCODE)"}
      - name: Verify source still exact and startup survives
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:DOJO_SOURCE_SHA -or (git rev-parse 'HEAD^{tree}').Trim() -ne $env:DOJO_SOURCE_TREE -or (git status --porcelain).Length -ne 0) { throw 'post-build source drift' }
          $p=$null
          try {$p=Start-Process -FilePath (Resolve-Path 'build-windows-v0357\DOJO_artefacts\Release\DOJO.exe') -PassThru; Start-Sleep -Seconds 10;if($p.HasExited){throw "DOJO exited during startup smoke ($($p.ExitCode))"}}
          finally {if($null -ne $p -and !$p.HasExited){Stop-Process -Id $p.Id -Force}}
      - name: Verify AMD64 runtime and emit manifest
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'; $exe='build-windows-v0357\DOJO_artefacts\Release\DOJO.exe'
          $b=[IO.File]::ReadAllBytes($exe); $pe=[BitConverter]::ToInt32($b,0x3c)
          if($b[$pe]-ne 0x50 -or $b[$pe+1]-ne 0x45 -or [BitConverter]::ToUInt16($b,$pe+4)-ne 0x8664){throw 'Expected AMD64 PE'}
          New-Item -ItemType Directory -Force dist-windows-build|Out-Null; Copy-Item $exe dist-windows-build\DOJO.exe
          $runtime=[ordered]@{}; foreach($n in @('libusb-1.0.dll','libusb-LICENSE.txt','libusb-NOTICE.txt')){$p=Join-Path (Split-Path $exe) $n;if(!(Test-Path $p)){throw "missing $n"};Copy-Item $p dist-windows-build\$n;$runtime[$n]=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower()}
          $embedded=@(Get-Content packaging\alpha-release\material-collections.txt|?{$_.Trim() -and !$_.Trim().StartsWith('#')}|%{$x=$_.Trim().Split('|');if($x.Count-ne 2){throw 'invalid materials policy'};if($x[1].Trim()-eq'repo'){$x[0].Trim()}});if(!$embedded.Count){throw 'no embedded collection'}
          $m=[ordered]@{schema='dojo-windows-build-v1';git_head_sha=$env:DOJO_SOURCE_SHA;product_source_ref=$env:DOJO_SOURCE_REF;product_tree=$env:DOJO_SOURCE_TREE;dojo_version=$env:DOJO_VERSION;architecture='x86_64';exe_sha256=(Get-FileHash dist-windows-build\DOJO.exe -Algorithm SHA256).Hash.ToLower();mk1_sha=$env:MK1_SHA;with_mk1=$true;asio_enabled=$false;wasapi_enabled=$true;libusb_version='1.0.30';runtime_files=$runtime;embedded_collections=$embedded;webview2_version=$env:WEBVIEW2_VERSION;runner_os=$env:RUNNER_OS;workflow_run_id=$env:GITHUB_RUN_ID}
          $m|ConvertTo-Json -Depth 5|Set-Content dist-windows-build\build-manifest.json -Encoding utf8
          python packaging/alpha-release/validate-windows-build-manifest.py dist-windows-build/build-manifest.json dist-windows-build/DOJO.exe;if($LASTEXITCODE){throw "manifest failed ($LASTEXITCODE)"}
      - name: Test WebUI and pad core
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dojo/WebUI/package-lock.json
      - name: Test WebUI and pad core
        shell: bash
        working-directory: dojo/WebUI
        run: npm ci && npm test && npm run test:pad-core
      - name: Guard mirror ref after build and tests
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-ref-guard-after"; mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"; chmod 600 "${key_dir}/id_ed25519"
          actual="$(GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote git@github.com:daikainozaki-cyber/dojo-ci.git "refs/heads/${DOJO_SOURCE_REF}" | awk '{print $1}')"
          test "${actual}" = "${DOJO_SOURCE_SHA}"
      - name: Upload Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: DOJO-v0.35.7-Windows-x64-build
          path: dojo/dist-windows-build
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DOJO-v0.35.7-Windows-test-diagnostics
          path: |
            dojo/build-windows-v0357/Testing/Temporary/LastTest.log
            dojo/windows-ctest.xml
            dojo/windows-required-ctest.xml
          if-no-files-found: ignore
          retention-days: 14
