name: Build DOJO v0.35.7 Windows x64 installer candidate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dojo-v0357-windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dojo-v0357-windows-installer-candidate
  cancel-in-progress: false

env:
  DOJO_SOURCE_REF: verify/v0357-final-embedded-materials-87ea47f2
  DOJO_SOURCE_SHA: f47c9c661d2835a06915675591ff22eca33c43ca
  DOJO_SOURCE_TREE: 87ea47f28673d8b400c2de5cc39d96599612d3e1
  DOJO_SOURCE_BASE_SHA: d5531fcc44631fe6368c0e16d379d8c8d0a81e55
  DOJO_SOURCE_BASE_TREE: 689e56c3a7cbc0b5349282fa0395421495e3a511
  DOJO_PRODUCT_HEAD_SHA: 302ba4d6493706fdf02e38ca3c88cca020d5f797
  DOJO_VERSION: 0.35.7
  WEBVIEW2_VERSION: 1.0.3485.44
  FULL_GATE_RUN_ID: '34931396488'
  FULL_GATE_CONTROL_SHA: 6eb2067cd3ed7c4b972c4daf8e4b2d78f43b21a5
  FULL_GATE_ARTIFACT: DOJO-v0.35.7-Windows-x64-repair-full-gate-34931396488
  FULL_GATE_APP_SHA256: 54e330356ac7cc904a30774c7a061b47cf6009f19de7830a8f3ba67c014c3e12

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout exact DOJO candidate from private mirror
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "${DOJO_SOURCE_DEPLOY_KEY}"
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-installer-ssh"
          mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"
          chmod 600 "${key_dir}/id_ed25519"
          git init -q dojo
          git -C dojo remote add origin git@github.com:daikainozaki-cyber/dojo-ci.git
          GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git -C dojo fetch --no-tags origin "refs/heads/${DOJO_SOURCE_REF}"
          git -C dojo checkout -q FETCH_HEAD
          git -C dojo submodule update --init --recursive --depth 1

      - name: Verify exact source provenance, version, and MK1
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          $tree=(git rev-parse 'HEAD^{tree}').Trim()
          $parent=(git rev-parse 'HEAD^').Trim()
          $parentTree=(git rev-parse 'HEAD^^{tree}').Trim()
          if($head -ne $env:DOJO_SOURCE_SHA -or $tree -ne $env:DOJO_SOURCE_TREE -or $parent -ne $env:DOJO_SOURCE_BASE_SHA -or $parentTree -ne $env:DOJO_SOURCE_BASE_TREE){ throw "source provenance drift: $head $tree $parent $parentTree" }
          $paths=@(git diff --name-only $env:DOJO_SOURCE_BASE_SHA HEAD)
          $expected=@('CMakeLists.txt','Source/EmbeddedMaterials.cpp','tests/test_embedded_materials.cpp')
          if($paths.Count -ne $expected.Count){ throw "unexpected changed path count: $($paths -join ',')" }
          foreach($p in $expected){ if($paths -notcontains $p){ throw "missing expected changed path: $p" } }
          if((git status --porcelain).Length -ne 0){ throw 'source checkout is dirty' }
          $submoduleStatus=@(git submodule status --recursive)
          if($submoduleStatus | Where-Object { $_ -match '^[\-\+U]' }){ throw 'submodule status drift' }
          git submodule foreach --recursive 'git diff --quiet && git diff --cached --quiet'
          if($LASTEXITCODE){ throw "submodule checkout dirty ($LASTEXITCODE)" }
          $version=(Select-String CMakeLists.txt -Pattern 'project\(DOJO VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          if($version -ne $env:DOJO_VERSION){ throw "version drift: $version" }
          $mk1=(Get-Content third_party\pad-sensei-keys-mk1\UPSTREAM_SHA).Trim()
          if($mk1 -ne '2325c445d5f35be7fefa0aa0601fd0e894896820'){ throw "MK1 drift: $mk1" }
          "MK1_SHA=$mk1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "STAGE_DIR=$env:RUNNER_TEMP\dojo-v0357-installer-stage" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "OUT_DIR=$env:RUNNER_TEMP\dojo-v0357-installer-out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "FULL_GATE_DIR=$env:RUNNER_TEMP\dojo-v0357-full-gate-payload" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALL_TEST_DIR=$env:RUNNER_TEMP\dojo-v0357-installed" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Guard mirror ref before packaging
        shell: bash
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-installer-ref-before"
          mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"
          chmod 600 "${key_dir}/id_ed25519"
          actual="$(GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote git@github.com:daikainozaki-cyber/dojo-ci.git "refs/heads/${DOJO_SOURCE_REF}" | awk '{print $1}')"
          test "${actual}" = "${DOJO_SOURCE_SHA}"

      - name: Download exact machine-green Windows payload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force $env:FULL_GATE_DIR,$env:STAGE_DIR,$env:OUT_DIR | Out-Null
          gh run download $env:FULL_GATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name $env:FULL_GATE_ARTIFACT --dir $env:FULL_GATE_DIR
          if($LASTEXITCODE){ throw "full-gate artifact download failed ($LASTEXITCODE)" }

      - name: Validate full-gate manifest and stage exact tested payload
        shell: pwsh
        working-directory: dojo
        run: |
          $ErrorActionPreference='Stop'
          $manifestPath=Join-Path $env:FULL_GATE_DIR 'build-manifest.json'
          if(!(Test-Path $manifestPath)){ throw 'full-gate build-manifest.json missing' }
          $m=Get-Content $manifestPath -Raw | ConvertFrom-Json
          if($m.schema -ne 'dojo-windows-build-v1'){ throw "manifest schema drift: $($m.schema)" }
          if($m.git_head_sha -ne $env:DOJO_SOURCE_SHA){ throw "manifest source SHA drift: $($m.git_head_sha)" }
          if($m.product_tree -ne $env:DOJO_SOURCE_TREE){ throw "manifest tree drift: $($m.product_tree)" }
          if($m.base_source_sha -ne $env:DOJO_SOURCE_BASE_SHA -or $m.base_source_tree -ne $env:DOJO_SOURCE_BASE_TREE){ throw 'manifest base provenance drift' }
          if($m.dojo_version -ne $env:DOJO_VERSION -or $m.architecture -ne 'x86_64'){ throw 'manifest version/architecture drift' }
          if(-not $m.with_mk1 -or $m.mk1_sha -ne $env:MK1_SHA){ throw 'manifest MK1 drift' }
          if($m.webview2_version -ne $env:WEBVIEW2_VERSION){ throw 'manifest WebView2 drift' }
          if([string]$m.workflow_run_id -ne $env:FULL_GATE_RUN_ID -or $m.control_sha -ne $env:FULL_GATE_CONTROL_SHA){ throw 'manifest full-gate run/control drift' }
          if(-not ($m.embedded_collections -contains 'HPS第4回')){ throw 'HPS第4回 missing from embedded collections' }

          $exe=Join-Path $env:FULL_GATE_DIR 'DOJO.exe'
          if(!(Test-Path $exe)){ throw 'full-gate DOJO.exe missing' }
          $exeHash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if($exeHash -ne $m.exe_sha256 -or $exeHash -ne $env:FULL_GATE_APP_SHA256){ throw "full-gate executable hash drift: $exeHash" }
          $b=[IO.File]::ReadAllBytes($exe); $pe=[BitConverter]::ToInt32($b,0x3c)
          if($b[$pe]-ne 0x50 -or $b[$pe+1]-ne 0x45 -or [BitConverter]::ToUInt16($b,$pe+4)-ne 0x8664){ throw 'Expected AMD64 PE' }

          foreach($n in @('DOJO.exe','libusb-1.0.dll','libusb-LICENSE.txt','libusb-NOTICE.txt')){
            $src=Join-Path $env:FULL_GATE_DIR $n
            if(!(Test-Path $src)){ throw "full-gate runtime file missing: $n" }
            if($n -ne 'DOJO.exe'){
              $hash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLower()
              if($hash -ne $m.runtime_files.$n){ throw "runtime hash drift for $n" }
            }
            Copy-Item $src (Join-Path $env:STAGE_DIR $n) -Force
          }
          foreach($n in @('はじめに-windows.txt','音源について.md')){
            $src=Join-Path 'packaging\alpha-release' $n
            if(Test-Path $src){ Copy-Item $src (Join-Path $env:STAGE_DIR $n) -Force }
          }
          "APP_SHA256=$exeHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup compiler if needed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc=$candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if(!$iscc){
            choco install innosetup --no-progress -y
            if($LASTEXITCODE){ throw "Inno Setup install failed ($LASTEXITCODE)" }
            $iscc=$candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if(!$iscc){ throw 'ISCC.exe not found' }
          "ISCC_EXE=$iscc" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build unsigned per-user Setup.exe from exact tested payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $issPath=Join-Path $env:RUNNER_TEMP 'dojo-v0357-installer.iss'
          @'
          #define MyAppName "DOJO"
          [Setup]
          AppId={{A3AE0A62-BC64-4B04-9FC9-49D16730A6E3}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=Pad Sensei
          DefaultDirName={localappdata}\Programs\Pad Sensei\DOJO
          DefaultGroupName=DOJO
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir={#MyOutputDir}
          OutputBaseFilename=DOJO-v{#MyAppVersion}-Windows-x64-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\DOJO.exe
          SetupLogging=yes

          [Files]
          Source: "{#MySourceDir}\DOJO.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "{#MySourceDir}\libusb-1.0.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "{#MySourceDir}\libusb-LICENSE.txt"; DestDir: "{app}"; Flags: ignoreversion
          Source: "{#MySourceDir}\libusb-NOTICE.txt"; DestDir: "{app}"; Flags: ignoreversion
          Source: "{#MySourceDir}\はじめに-windows.txt"; DestDir: "{app}"; Flags: ignoreversion skipifsourcedoesntexist
          Source: "{#MySourceDir}\音源について.md"; DestDir: "{app}"; Flags: ignoreversion skipifsourcedoesntexist

          [Icons]
          Name: "{group}\DOJO"; Filename: "{app}\DOJO.exe"

          [Run]
          Filename: "{app}\DOJO.exe"; Description: "DOJO を起動"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path $issPath -Encoding utf8
          & $env:ISCC_EXE "/DMyAppVersion=$env:DOJO_VERSION" "/DMySourceDir=$env:STAGE_DIR" "/DMyOutputDir=$env:OUT_DIR" $issPath
          if($LASTEXITCODE){ throw "ISCC failed ($LASTEXITCODE)" }
          $setup=Join-Path $env:OUT_DIR "DOJO-v$env:DOJO_VERSION-Windows-x64-Setup.exe"
          if(!(Test-Path $setup)){ throw 'Setup.exe missing' }
          "SETUP_PATH=$setup" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "SETUP_SHA256=$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Silent install, launch smoke, and uninstall round trip
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item -Recurse -Force $env:INSTALL_TEST_DIR -ErrorAction SilentlyContinue
          & $env:SETUP_PATH /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$env:INSTALL_TEST_DIR"
          if($LASTEXITCODE){ throw "silent install failed ($LASTEXITCODE)" }
          $installedExe=Join-Path $env:INSTALL_TEST_DIR 'DOJO.exe'
          if(!(Test-Path $installedExe)){ throw 'installed DOJO.exe missing' }
          $installedHash=(Get-FileHash $installedExe -Algorithm SHA256).Hash.ToLower()
          if($installedHash -ne $env:FULL_GATE_APP_SHA256){ throw "installed binary hash drift: $installedHash" }
          foreach($n in @('libusb-1.0.dll','libusb-LICENSE.txt','libusb-NOTICE.txt')){ if(!(Test-Path (Join-Path $env:INSTALL_TEST_DIR $n))){ throw "installed runtime missing: $n" } }
          $p=$null
          try {
            $p=Start-Process -FilePath $installedExe -WorkingDirectory $env:INSTALL_TEST_DIR -PassThru
            Start-Sleep -Seconds 10
            if($p.HasExited){ throw "installed DOJO exited during startup smoke ($($p.ExitCode))" }
          } finally {
            if($null -ne $p -and !$p.HasExited){ Stop-Process -Id $p.Id -Force }
          }
          $uninstaller=Join-Path $env:INSTALL_TEST_DIR 'unins000.exe'
          if(!(Test-Path $uninstaller)){ throw 'uninstaller missing' }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if($LASTEXITCODE){ throw "silent uninstall failed ($LASTEXITCODE)" }
          Start-Sleep -Seconds 2
          if(Test-Path $installedExe){ throw 'DOJO.exe remained after uninstall' }

      - name: Emit installer provenance manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=[ordered]@{
            schema='dojo-windows-installer-candidate-v2'
            dojo_version=$env:DOJO_VERSION
            architecture='x86_64'
            product_head_sha=$env:DOJO_PRODUCT_HEAD_SHA
            product_tree=$env:DOJO_SOURCE_TREE
            mirror_ref=$env:DOJO_SOURCE_REF
            mirror_sha=$env:DOJO_SOURCE_SHA
            mirror_base_sha=$env:DOJO_SOURCE_BASE_SHA
            source_full_gate_run_id=$env:FULL_GATE_RUN_ID
            source_full_gate_control_sha=$env:FULL_GATE_CONTROL_SHA
            source_full_gate_artifact=$env:FULL_GATE_ARTIFACT
            tested_app_sha256=$env:APP_SHA256
            app_rebuilt_for_installer=$false
            installer_sha256=$env:SETUP_SHA256
            installer_signed=$false
            install_scope='per-user'
            default_install_dir='%LocalAppData%\Programs\Pad Sensei\DOJO'
            install_round_trip_verified=$true
            local_sidecar_materials_included=$false
            mk1_sha=$env:MK1_SHA
            webview2_sdk_version=$env:WEBVIEW2_VERSION
            workflow_run_id=$env:GITHUB_RUN_ID
            control_sha=$env:GITHUB_SHA
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $env:OUT_DIR 'installer-manifest.json') -Encoding utf8

      - name: Final source and mirror ref guard
        shell: bash
        working-directory: dojo
        env:
          DOJO_SOURCE_DEPLOY_KEY: ${{ secrets.DOJO_SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${DOJO_SOURCE_SHA}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${DOJO_SOURCE_TREE}"
          test -z "$(git status --porcelain)"
          key_dir="$(cygpath -u "${RUNNER_TEMP}")/dojo-installer-ref-after"
          mkdir -p "${key_dir}"
          trap 'rm -f "${key_dir}/id_ed25519"' EXIT
          printf '%s\n' "${DOJO_SOURCE_DEPLOY_KEY}" > "${key_dir}/id_ed25519"
          chmod 600 "${key_dir}/id_ed25519"
          actual="$(GIT_SSH_COMMAND="ssh -i ${key_dir}/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote git@github.com:daikainozaki-cyber/dojo-ci.git "refs/heads/${DOJO_SOURCE_REF}" | awk '{print $1}')"
          test "${actual}" = "${DOJO_SOURCE_SHA}"

      - name: Upload installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: DOJO-v0.35.7-Windows-x64-installer-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/dojo-v0357-installer-out
          if-no-files-found: error
          retention-days: 14
